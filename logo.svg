<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradient for the worm body -->
    <linearGradient id="wormGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8d5a2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a7c59;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="100" cy="100" r="95" fill="#f0f7ee" stroke="#4a7c59" stroke-width="4"/>

  <!-- Stylised C. elegans worm in an S-curve -->
  <path d="M 55 145 C 45 120, 70 105, 90 110 C 110 115, 125 100, 115 80 C 105 60, 120 45, 145 55"
        fill="none" stroke="url(#wormGrad)" stroke-width="12" stroke-linecap="round"
        filter="url(#shadow)"/>

  <!-- Worm head (anterior bulb) -->
  <circle cx="145" cy="55" r="8" fill="#4a7c59" filter="url(#shadow)"/>

  <!-- Pharynx detail (small inner circle on head) -->
  <circle cx="148" cy="53" r="2.5" fill="#a8d5a2"/>

  <!-- Body annuli / segmentation lines along the worm -->
  <line x1="62" y1="131" x2="58" y2="137" stroke="#4a7c59" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="76" y1="113" x2="72" y2="108" stroke="#4a7c59" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="98" y1="112" x2="100" y2="118" stroke="#4a7c59" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="118" y1="93" x2="122" y2="97" stroke="#4a7c59" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="116" y1="72" x2="112" y2="68" stroke="#4a7c59" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="130" y1="56" x2="127" y2="52" stroke="#4a7c59" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- "LWC" text -->
  <text x="100" y="178" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="26" font-weight="bold" fill="#4a7c59" letter-spacing="4">LWC</text>

  <!-- "LONDON WORM CLUB" arc text at top -->
  <path id="topArc" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#4a7c59" letter-spacing="2.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">LONDON WORM CLUB</textPath>
  </text>
</svg>
